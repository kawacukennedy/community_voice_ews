name: Bug Report
description: Report a bug to help us improve
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: The API returns 500 when...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Send POST to /api/reports with...
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Copy and paste any relevant logs, errors, or screenshots.
      render: shell
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Backend API
        - Frontend / Map
        - NLP Classification
        - SMS Integration
        - ICPAC Integration
        - Documentation
        - CI/CD
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or version tag
      placeholder: e.g. 1d3b0ccf
