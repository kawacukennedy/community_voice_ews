services:
  - type: web
    name: community-voice-ews
    env: python
    region: oregon
    plan: free
    pythonVersion: 3.12
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      ./start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./ews.db
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "*"
