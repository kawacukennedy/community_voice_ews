version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./ews.db
      SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: DEBUG
      ALLOWED_ORIGINS: "*"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
