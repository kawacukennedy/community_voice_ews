services:
  - type: web
    name: community-voice-ews-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        value: sandbox
      - key: SMS_SENDER_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,https://*.onrender.com,http://localhost:5500,http://localhost:8000
      - key: LOG_LEVEL
        value: INFO
